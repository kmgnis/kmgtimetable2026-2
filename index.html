<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026학년도 2학기 주간시간표 (수업 교환 관리)</title>

<!-- Firebase SDK 추가 -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
  :root {
    --bg: #F1EFE8;
    --panel: #FBFAF6;
    --panel-alt: #F5F2EA;
    --border: #E0DBCC;
    --border-soft: #ECE8DC;
    --ink: #232017;
    --ink-soft: #43402F;
    --muted: #6B6558;
    --muted-2: #8A8574;
    --faint: #C7C1AE;
    --accent: #B7472A;
    --accent-soft: #F6E3DB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    color: var(--ink);
  }
  .page { padding: 24px 16px 48px; }
  .wrap { max-width: 960px; margin: 0 auto; }

  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted-2); font-weight: 600; margin-bottom: 4px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; flex-wrap: wrap; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: #B8B2A0; }
  .meta-tag {
    font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 20px;
  }

  .admin-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--ink-soft);
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .admin-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .storage-status {
    font-size: 11.5px; color: var(--muted-2); margin: 6px 0 18px; padding: 6px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: inline-block;
  }
  .storage-status.warn { color: #8A5A1E; background: #FBF1DF; border-color: #EBD7A8; }

  .segment { display: inline-flex; background: #E6E2D6; border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .segment button { border: none; background: transparent; padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; }
  .segment button.active { background: var(--ink); color: var(--bg); }

  .section-label { font-size: 12px; font-weight: 700; color: var(--muted-2); margin: 0 0 8px; letter-spacing: 0.02em; }

  .selector-block { margin-bottom: 16px; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; margin-bottom: 10px; max-width: 320px; }
  .search-box input { border: none; outline: none; background: transparent; font-size: 13.5px; color: var(--ink); flex: 1; font-family: inherit; }
  .clear-btn { border: none; background: transparent; cursor: pointer; padding: 2px; display: none; align-items: center; }
  .clear-btn.show { display: flex; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip.week.active { background: var(--accent); border-color: var(--accent); }
  .chip .del-x { opacity: 0.6; font-weight: 800; }
  .chip .del-x:hover { opacity: 1; }
  .chip .move-x { opacity: 0.55; font-weight: 800; padding: 0 2px; }
  .chip .move-x:hover { opacity: 1; }
  .chip.add-week { border-style: dashed; color: var(--muted-2); }
  .no-result { font-size: 13px; color: var(--faint); padding: 6px 2px; }

  .swap-panel { margin-top: 16px; margin-bottom: 16px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .swap-panel-title { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .swap-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); padding: 6px 0; border-top: 1px solid var(--border-soft); }
  .swap-item:first-of-type { border-top: none; }
  .swap-item .orig { color: var(--muted-2); font-size: 11.5px; }
  .swap-del-btn { border: none; background: transparent; color: var(--muted-2); cursor: pointer; font-size: 15px; padding: 2px 6px; flex-shrink: 0; }
  .swap-del-btn:hover { color: var(--accent); }
  .swap-empty { font-size: 12.5px; color: var(--muted-2); }
  .admin-hint { font-size: 12px; color: var(--muted-2); margin-top: 6px; }

  .pending-banner {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 14px;
  }
  .pending-banner.show { display: flex; }
  .pending-cancel { border: none; background: rgba(255,255,255,0.2); color: #fff; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
  th:last-child, td:last-child { border-right: none; }

  .corner-cell, .day-header, .period-cell { background: var(--panel-alt); }
  .corner-cell { width: 52px; padding: 10px 6px; font-size: 12px; font-weight: 700; color: var(--muted-2); }
  .day-header { padding: 10px 6px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); position: relative; }
  .day-header.today { background: var(--ink); color: var(--bg); }
  .today-tag { display: block; font-size: 9.5px; font-weight: 600; color: #C9BE9F; margin-top: 1px; letter-spacing: 0.04em; }
  .period-cell { padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .inactive-cell { background: repeating-linear-gradient(135deg, var(--bg), var(--bg) 4px, #EAE6D9 4px, #EAE6D9 8px); }
  .empty-cell { text-align: center; color: var(--faint); font-size: 12.5px; }
  .class-cell { padding: 6px; text-align: center; vertical-align: middle; position: relative; }
  .cell-bg-swap { background: #FFF4C2 !important; }
  .cell-bg-sub { background: #FBDCE4 !important; }
  .class-tag { color: #fff; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 4px 0; margin-bottom: 3px; }
  .class-sub { font-size: 10.5px; color: var(--muted-2); font-weight: 600; }

  .cell-editable { cursor: pointer; user-select: none; -webkit-user-select: none; -moz-user-select: none; }
  .cell-editable:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell-selected { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft) !important; }
  .badge-swap {
    position: absolute; top: 2px; right: 3px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px #fff;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  footer.note { margin-top: 14px; font-size: 11.5px; color: var(--faint); text-align: center; }

  /* 전체 보기 (요일x교시 x 전체 교사) */
  .all-table-wrap { max-height: 640px; overflow: auto; }
  .all-table { border-collapse: collapse; font-size: 11px; min-width: 100%; }
  .all-table th, .all-table td { border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
  .all-table th:last-child, .all-table td:last-child { border-right: none; }
  .all-day-header, .all-period-header, .all-teacher-header {
    background: var(--panel-alt); font-weight: 700; color: var(--ink-soft); font-size: 11px;
    padding: 8px 4px; position: sticky; top: 0; z-index: 3; white-space: nowrap;
  }
  .all-day-cell, .all-period-cell {
    background: var(--panel-alt); font-weight: 700; color: var(--muted-2); font-size: 11px;
    text-align: center; padding: 6px 4px; position: sticky; z-index: 2; white-space: nowrap;
  }
  .all-day-cell { left: 0; min-width: 34px; z-index: 4; }
  .all-period-cell { left: 34px; min-width: 30px; }
  .all-day-header { left: 0; z-index: 5; min-width: 34px; }
  .all-period-header { left: 34px; z-index: 4; min-width: 30px; }
  .all-day-cell.today, .all-day-header.today { background: var(--ink); color: var(--bg); }
  .all-teacher-header { min-width: 62px; text-align: center; }
  .all-table .class-cell { padding: 3px 2px; min-width: 62px; }
  .all-table .class-tag { font-size: 10px; padding: 3px 0; margin-bottom: 1px; border-radius: 4px; }
  .all-table .class-sub { font-size: 8.5px; }
  .all-table .empty-cell { min-width: 62px; font-size: 11px; }
  .all-merged {
    text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted);
    background: repeating-linear-gradient(135deg, var(--panel), var(--panel) 6px, var(--panel-alt) 6px, var(--panel-alt) 12px);
    padding: 8px 4px;
  }
  .all-day-row-alt td.class-cell, .all-day-row-alt td.empty-cell, .all-day-row-alt td.all-merged { background: #EDEAE0; }
  .all-day-row-alt .all-period-cell { background: #E8E4D6; }
  .all-day-divider td { border-top: 2px solid var(--ink-soft); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(35,32,23,0.45);
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel); border-radius: 14px; padding: 22px; max-width: 380px; width: 100%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }
  .modal-msg { font-size: 14px; color: var(--ink-soft); white-space: pre-line; line-height: 1.5; margin-bottom: 16px; }
  .modal-input {
    width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 16px; outline: none; box-sizing: border-box;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-btn {
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--border); background: var(--panel);
    color: var(--ink-soft);
  }
  .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-title { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
  .modal-choice-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; margin-bottom: 4px; }
  .modal-choice-btn {
    text-align: left; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
    background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; cursor: pointer;
  }
  .modal-choice-btn:hover { border-color: var(--accent); }
  .action-card {
    display: block; width: 100%; text-align: left; font-family: inherit; background: var(--panel-alt);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .action-card:hover { border-color: var(--accent); }
  .action-card-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
  .action-card-desc { font-size: 12px; color: var(--muted-2); }
  .badge-sub { background: #2C5C8A !important; }
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <div class="top-bar">
      <div>
        <div class="eyebrow">2026학년도 · 2학기</div>
        <h1>주간시간표</h1>

    <div id="storageStatus" class="storage-status">저장소 확인 중…</div>

    <div class="segment">
      <button id="btnTeacher" class="active">교사별 보기</button>
      <button id="btnClass">학급별 보기</button>

    <div class="selector-block">

      <div id="weekChips" class="chip-row"></div>

    <div id="pendingBanner" class="pending-banner">
      <span id="pendingText"></span>
      <button class="pending-cancel" id="pendingCancelBtn">선택 취소</button>
    </div>

    <div id="teacherSelector" class="selector-block">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8574" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="teacherSearch" placeholder="선생님 이름 검색" />

    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="bodyRows"></tbody>
      </table>
    </div>

    <div class="table-wrap all-table-wrap" id="allTableWrap" style="display:none;">
      <table class="all-table">
        <thead><tr id="allHeadRow"></tr></thead>
        <tbody id="allBodyRows"></tbody>
      </table>
    </div>

    <div id="swapPanel" class="swap-panel" style="display:none;">
      <div class="swap-panel-title">📌 이번 주 수업 교환 안내</div>
      <div id="swapList"></div>
      <div id="adminEditHint" class="admin-hint" style="display:none;"></div>
    </div>

    <div class="legend" id="legend"></div>
    <footer class="note">2026-08-27 확정본 기준 · 교환 내용은 선택한 주차에만 적용됩니다</footer>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

function newId(prefix) {
  return prefix + Date.now() + Math.floor(Math.random() * 1000);

--------------------------------------------------------- */
// 예전 형식(주차 객체 안에 swaps/subs가 들어있던 구조)을
// 새 형식(주차 메타데이터 + 전역 exchanges 목록)으로 변환
function migrateLegacyData(raw) {
  if (!raw) return { weeks: [], exchanges: [] };

  // 새 형식으로 이미 저장된 경우
  if (!Array.isArray(raw) && raw.weeks) {
    return { weeks: raw.weeks || [], exchanges: raw.exchanges || [] };
  }

  // 예전 형식: raw 자체가 주차 배열이고, 각 주차 안에 swaps/subs가 들어있음
  const legacyWeeks = Array.isArray(raw) ? raw : [];
  const newWeeks = [];
  const newExchanges = [];
  legacyWeeks.forEach(w => {
    newWeeks.push({ id: w.id, label: w.label });
    (w.swaps || []).forEach(sw => {
      const a = baseMap.get(`${sw.dayA}|${sw.periodA}|${sw.roomA}`);
      const b = baseMap.get(`${sw.dayB}|${sw.periodB}|${sw.roomB}`);
      newExchanges.push({
        id: newId("sw"),
        type: "swap",
        a: { weekId: w.id, day: sw.dayA, period: sw.periodA, room: sw.roomA, teacherIdx: a ? a.teacherIdx : null, subject: a ? a.subject : null },
        b: { weekId: w.id, day: sw.dayB, period: sw.periodB, room: sw.roomB, teacherIdx: b ? b.teacherIdx : null, subject: b ? b.subject : null },
      });
    });
    (w.subs || []).forEach(su => {
      newExchanges.push({ id: newId("su"), type: "sub", weekId: w.id, day: su.day, period: su.period, room: su.room, teacherIdx: su.teacherIdx });
    });
  });
  return { weeks: newWeeks, exchanges: newExchanges };
}

  const el = document.getElementById("storageStatus");

  if (kind === "cloud") {
    el.textContent = "🔗 클라우드 공유 저장소 연결 완료 (실시간 자동 동기화 적용됨)";
  } else if (kind === "local") {
    el.textContent = "⚠️ Firebase 키 미설정: 브라우저에만 저장됩니다 (다른 사람 화면에 안 보임)";
    el.classList.add("warn");
  } else {
    el.textContent = "⚠️ 저장소 오류가 발생했습니다.";
    el.classList.add("warn");
  }
}

    db.ref("timetable_weeks").on("value", (snapshot) => {
      const migrated = migrateLegacyData(snapshot.val());
      weeks = migrated.weeks;
      exchanges = migrated.exchanges;
      renderAll();
    });
  } else {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const migrated = migrateLegacyData(raw ? JSON.parse(raw) : null);
      weeks = migrated.weeks;
      exchanges = migrated.exchanges;
      setStorageStatus("local");
    } catch (e) {
      weeks = [];
      exchanges = [];
      setStorageStatus("none");
    }
    renderAll();
  }
}

function saveData() {
  const payload = { weeks, exchanges };
  if (db) {
    db.ref("timetable_weeks").set(payload).catch((err) => {
      console.error("Firebase 저장 실패:", err);
      alert("데이터 저장 실패: " + err.message);
    });
  } else {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      console.error(e);
    }
  }
}

/* ---------------------------------------------------------
   시간표 변경 및 계산 로직
--------------------------------------------------------- */
function currentWeek() {
  return weeks.find(w => w.id === selectedWeekId) || null;
}

function buildEffective(weekId) {
  const id = weekId !== undefined ? weekId : selectedWeekId;
  const map = new Map(baseMap);
  const changed = new Set();
  const subbed = new Set();
  if (id !== null && id !== undefined) {
    exchanges.forEach(ex => {
      if (ex.type === "swap") {
        if (ex.a.weekId === id) {
          const key = `${ex.a.day}|${ex.a.period}|${ex.a.room}`;
          if (ex.b.subject != null) map.set(key, { teacherIdx: ex.b.teacherIdx, subject: ex.b.subject });
          else map.delete(key);
          changed.add(key);
        }
        if (ex.b.weekId === id) {
          const key = `${ex.b.day}|${ex.b.period}|${ex.b.room}`;
          if (ex.a.subject != null) map.set(key, { teacherIdx: ex.a.teacherIdx, subject: ex.a.subject });
          else map.delete(key);
          changed.add(key);
        }
      }
    });
    exchanges.forEach(ex => {
      if (ex.type === "sub" && ex.weekId === id) {
        const key = `${ex.day}|${ex.period}|${ex.room}`;
        const cur = map.get(key);
        if (cur) {
          map.set(key, { teacherIdx: ex.teacherIdx, subject: cur.subject });
          subbed.add(key);
        }
      }
    });
  }
  return { map, changed, subbed };
}

function effectiveEntryAt(weekId, day, period, room) {
  const { map } = buildEffective(weekId);
  return map.get(`${day}|${period}|${room}`) || null;
}

function findTeacherEntry(effMap, day, period, teacherIdx) {
  for (const room of ROOMS) {
    const key = `${day}|${period}|${room}`;
    const entry = effMap.get(key);
    if (entry && entry.teacherIdx === teacherIdx && entry.subject !== "창체") return { room, entry, key };
  }
  return null;
}

function slotDescription(weekId, day, period, room, entry) {
  const base = `[${weekLabel(weekId)}] ${roomLabel(room)} ${DAY_FULL[day]} ${period}교시`;
  if (!entry) return `${base} (빈 시간)`;
  if (entry.subject === "창체") return `${base} — ${entry.subject}`;
  return `${base} — ${entry.subject} · ${TEACHERS[entry.teacherIdx]}`;
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("show");
}

function openModal(bodyHtml, actions) {
  const overlay = document.getElementById("modalOverlay");
  document.getElementById("modalBody").innerHTML = bodyHtml;
  const actionsEl = document.getElementById("modalActions");
  actionsEl.innerHTML = "";
  actions.forEach(a => {
    const btn = document.createElement("button");
    btn.className = "modal-btn" + (a.primary ? " primary" : "");
    btn.textContent = a.label;
    btn.onclick = () => { closeModal(); if (a.onClick) a.onClick(); };
    actionsEl.appendChild(btn);
  });
  overlay.classList.add("show");
  return overlay;
}

function showModal({ message, withInput = false, defaultValue = "", inputType = "text", onOk }) {
  const bodyHtml = `
    <div class="modal-msg">${escapeHtml(message)}</div>
    ${withInput ? `<input class="modal-input" id="modalPromptInput" type="${inputType}" value="${escapeHtml(defaultValue)}" />` : ""}
  `;
  openModal(bodyHtml, [
    { label: "취소" },
    { label: "확인", primary: true, onClick: () => {
        const val = withInput ? document.getElementById("modalPromptInput").value : true;
        if (val) onOk(val);
      }
    },
  ]);
  if (withInput) {
    setTimeout(() => {
      const el = document.getElementById("modalPromptInput");
      if (el) {
        el.focus();
        // 입력창에서 Enter를 누르면 바로 확인 처리
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") document.getElementById("modalActions").lastChild.click();
        });
      }
    }, 0);
  }
}

function showChoiceModal(title, choices) {
  const bodyHtml = `
    <div class="modal-title">${escapeHtml(title)}</div>
    ${choices.map((c, i) => `
      <button class="action-card" data-choice="${i}">
        <div class="action-card-title">${escapeHtml(c.label)}</div>
        ${c.desc ? `<div class="action-card-desc">${escapeHtml(c.desc)}</div>` : ""}
      </button>
    `).join("")}
  `;
  const overlay = openModal(bodyHtml, [{ label: "취소" }]);
  choices.forEach((c, i) => {
    const btn = overlay.querySelector(`[data-choice="${i}"]`);
    if (btn) btn.onclick = () => { closeModal(); if (c.onClick) c.onClick(); };
  });
}

function showTeacherPickModal(title, excludeIdx, onPick) {
  const bodyHtml = `
    <div class="modal-title">${escapeHtml(title)}</div>
    <div class="modal-choice-list" id="teacherPickList"></div>
  `;
  const overlay = openModal(bodyHtml, [{ label: "취소" }]);
  const list = overlay.querySelector("#teacherPickList");
  TEACHERS.forEach((name, idx) => {
    if (idx === excludeIdx) return;
    const btn = document.createElement("button");
    btn.className = "modal-choice-btn";
    btn.textContent = name;
    btn.onclick = () => { closeModal(); onPick(idx); };

}

function renderWeekChips() {
  const container = document.getElementById("weekChips");
  container.innerHTML = "";

  const baseBtn = document.createElement("button");
  baseBtn.className = "chip week" + (selectedWeekId === null ? " active" : "");
  baseBtn.textContent = "기본 시간표";
  // 기본 시간표는 항상 원본 그대로 유지해야 하므로 편집 대상이 될 수 없지만,
  // 다른 주차와 교환을 진행 중이었다면 그 선택은 유지한다 (탐색용으로만 전환)
  baseBtn.onclick = () => { selectedWeekId = null; renderAll(); };
  container.appendChild(baseBtn);

  weeks.forEach((w, idx) => {
    const btn = document.createElement("button");
    btn.className = "chip week" + (w.id === selectedWeekId ? " active" : "");
    const moveLeft = adminMode && idx > 0 ? `<span class="move-x" data-move="left" data-id="${w.id}" title="왼쪽으로 이동">◀</span>` : "";
    const moveRight = adminMode && idx < weeks.length - 1 ? `<span class="move-x" data-move="right" data-id="${w.id}" title="오른쪽으로 이동">▶</span>` : "";
    const delX = adminMode ? `<span class="del-x" data-del="${w.id}">✕</span>` : "";
    btn.innerHTML = moveLeft + `<span>${escapeHtml(w.label)}</span>` + moveRight + delX;
    btn.onclick = (e) => {
      if (e.target && e.target.dataset && e.target.dataset.move) {
        e.stopPropagation();
        const dir = e.target.dataset.move;
        const i = weeks.findIndex(x => x.id === w.id);
        const j = dir === "left" ? i - 1 : i + 1;
        if (j < 0 || j >= weeks.length) return;
        [weeks[i], weeks[j]] = [weeks[j], weeks[i]];
        saveData();
        renderAll();
        return;
      }
      if (e.target && e.target.dataset && e.target.dataset.del) {
        e.stopPropagation();
        showModal({
          message: `"${w.label}" 주차와 이 주차가 관련된 모든 교환·결보강 기록을 삭제할까요?\n(다른 주차와 연결된 교환도 함께 삭제됩니다)`,
          onOk: () => {
            weeks = weeks.filter(x => x.id !== w.id);
            // 이 주차를 참조하는 exchanges는 한쪽이 사라지면 의미가 없으므로 함께 제거
            exchanges = exchanges.filter(ex =>
              ex.type === "swap" ? (ex.a.weekId !== w.id && ex.b.weekId !== w.id) : ex.weekId !== w.id
            );
            if (selectedWeekId === w.id) selectedWeekId = null;
            if (pendingSwap && pendingSwap.weekId === w.id) pendingSwap = null;
            saveData();
            renderAll();
          }
        });
        return;
      }
      // 주차 전환 시 pendingSwap을 유지해야 "다른 주차의 교시와 교환"이 가능함
      selectedWeekId = w.id;
      renderAll();
    };
    container.appendChild(btn);
  });

  if (adminMode) {
    const addBtn = document.createElement("button");
    addBtn.className = "chip add-week";
    addBtn.textContent = "+ 주차 추가";
    addBtn.onclick = () => {
      showModal({
        message: "새 주차 이름을 입력하세요 (예: 9월 4주차 9/22~9/26)",
        withInput: true,
        onOk: (label) => {
          if (label && label.trim()) {
            const w = { id: newId("w"), label: label.trim() };
            weeks.push(w);
            selectedWeekId = w.id;
            saveData();
            renderAll();
          }
        }
      });
    };
    container.appendChild(addBtn);
  }
}

      : "수업 교환·결보강 편집은 학급별 보기에서만 가능합니다.";

function handleCellClick(day, period, room, entry) {
  if (pendingSwap) {
    const isSameSlot = pendingSwap.weekId === selectedWeekId && pendingSwap.day === day && pendingSwap.period === period && pendingSwap.room === room;
    if (isSameSlot) {
      pendingSwap = null;
      renderAll();
      return;
    }

    const swapSource = { weekId: pendingSwap.weekId, day: pendingSwap.day, period: pendingSwap.period, room: pendingSwap.room };
    const swapTarget = { weekId: selectedWeekId, day, period, room };
    if (!weeks.some(w => w.id === swapSource.weekId) || !weeks.some(w => w.id === swapTarget.weekId)) {
      pendingSwap = null;
      renderAll();
      return;
    }

    const firstEntry = effectiveEntryAt(swapSource.weekId, swapSource.day, swapSource.period, swapSource.room);
    const secondEntry = entry;
    showModal({
      message: `다음 두 교시를 교환할까요?\n\n① ${slotDescription(swapSource.weekId, swapSource.day, swapSource.period, swapSource.room, firstEntry)}\n② ${slotDescription(swapTarget.weekId, swapTarget.day, swapTarget.period, swapTarget.room, secondEntry)}`,
      onOk: () => {
        // 확인을 누르는 시점에 각 슬롯의 최신 내용을 다시 가져와서 고정한다 —
        // 확인창이 떠 있는 동안 실시간 동기화로 데이터가 새로 바뀔 수 있으므로
        const freshA = effectiveEntryAt(swapSource.weekId, swapSource.day, swapSource.period, swapSource.room);
        const freshB = effectiveEntryAt(swapTarget.weekId, swapTarget.day, swapTarget.period, swapTarget.room);
        exchanges.push({
          id: newId("sw"),
          type: "swap",
          a: { weekId: swapSource.weekId, day: swapSource.day, period: swapSource.period, room: swapSource.room, teacherIdx: freshA ? freshA.teacherIdx : null, subject: freshA ? freshA.subject : null },
          b: { weekId: swapTarget.weekId, day: swapTarget.day, period: swapTarget.period, room: swapTarget.room, teacherIdx: freshB ? freshB.teacherIdx : null, subject: freshB ? freshB.subject : null },
        });
        saveData();
        pendingSwap = null;
        renderAll();
      }
    });
    pendingSwap = null;
    renderAll();
    return;
  }

  if (!entry) {
    pendingSwap = { weekId: selectedWeekId, day, period, room };
    renderAll();
    return;
  }

  showChoiceModal(slotDescription(selectedWeekId, day, period, room, entry), [
    {
      label: "다른 교시와 교환하기",
      desc: "이 수업을 다른 요일·교시(다른 주차 포함)의 수업과 서로 맞바꿉니다. 다음 주와 바꾸려면, 선택 후 위에서 주차를 바꿔 두 번째 교시를 클릭하세요.",
      onClick: () => { pendingSwap = { weekId: selectedWeekId, day, period, room }; renderAll(); }
    },
    {
      label: "결보강 등록 (선생님만 대체)",
      desc: "과목은 그대로 두고, 이 시간의 담당 선생님만 바꿉니다.",
      onClick: () => {
        showTeacherPickModal(`${entry.subject} 결보강 — 대신 들어갈 선생님`, entry.teacherIdx, (newIdx) => {
          const weekIdAtPick = selectedWeekId;
          if (!weeks.some(w => w.id === weekIdAtPick)) return;
          const existingIdx = exchanges.findIndex(ex => ex.type === "sub" && ex.weekId === weekIdAtPick && ex.day === day && ex.period === period && ex.room === room);
          const record = { id: existingIdx >= 0 ? exchanges[existingIdx].id : newId("su"), type: "sub", weekId: weekIdAtPick, day, period, room, teacherIdx: newIdx };
          if (existingIdx >= 0) exchanges[existingIdx] = record; else exchanges.push(record);
          saveData();
          renderAll();
        });
      }
    },
  ]);
}

function renderTable(eff) {
  const headRow = document.getElementById("headRow");
  headRow.innerHTML = '<th class="corner-cell">교시</th>';
  DAYS.forEach(d => {
    const th = document.createElement("th");
    th.className = "day-header" + (d === today ? " today" : "");
    th.innerHTML = DAY_FULL[d] + (d === today ? '<span class="today-tag">오늘</span>' : "");
    headRow.appendChild(th);
  });

  const editable = mode === "class" && adminMode && selectedWeekId !== null;

  const body = document.getElementById("bodyRows");
  body.innerHTML = "";
  for (let period = 1; period <= MAX_PERIOD; period++) {
    const tr = document.createElement("tr");
    const tdP = document.createElement("td");
    tdP.className = "period-cell";
    tdP.textContent = period;
    tr.appendChild(tdP);

    DAYS.forEach(d => {
      const active = period <= PERIODS_BY_DAY[d];
      if (!active) {
        const td = document.createElement("td");
        td.className = "inactive-cell";
        tr.appendChild(td);
        return;
      }

      let entry = null, changed = false, subbed = false, key = null;
      if (mode === "class") {
        key = `${d}|${period}|${selectedRoom}`;
        entry = eff.map.get(key) || null;
        changed = eff.changed.has(key);
        subbed = eff.subbed.has(key);
      } else {
        const idx = TEACHERS.indexOf(selectedTeacher);
        const found = findTeacherEntry(eff.map, d, period, idx);
        if (found) { entry = found.entry; changed = eff.changed.has(found.key); subbed = eff.subbed.has(found.key); key = found.key; }
      }

      const td = document.createElement("td");
      if (!entry) {
        td.className = "empty-cell";
        td.textContent = "-";
      } else {
        td.className = "class-cell";
        const cat = categoryOf(entry.subject);
        const color = CATEGORY_COLOR[cat];
        const sub = mode === "class"
          ? (entry.subject === "창체" ? "" : TEACHERS[entry.teacherIdx])
          : (() => {
              const found = findTeacherEntry(eff.map, d, period, TEACHERS.indexOf(selectedTeacher));
              return found ? roomLabel(found.room) : "";
            })();
        td.innerHTML = `<div class="class-tag" style="background:${color}">${entry.subject}</div>` + (sub ? `<div class="class-sub">${sub}</div>` : "");
        if (subbed) {
          const badge = document.createElement("div");
          badge.className = "badge-swap badge-sub";
          td.appendChild(badge);
          const orig = baseMap.get(key);
          td.title = "결보강 — 원래 담당: " + (orig ? TEACHERS[orig.teacherIdx] : "-");
          if (mode === "class") td.classList.add("cell-bg-sub");
        } else if (changed) {
          const badge = document.createElement("div");
          badge.className = "badge-swap";
          td.appendChild(badge);
          const orig = baseMap.get(key);
          const origLabel = orig ? (orig.subject === "창체" ? orig.subject : orig.subject + " · " + TEACHERS[orig.teacherIdx]) : "빈 시간";
          td.title = "교환됨 — 원래: " + origLabel;
          if (mode === "class") td.classList.add("cell-bg-swap");
        }
      }

      if (editable) {
        td.classList.add("cell-editable");
        if (pendingSwap && pendingSwap.weekId === selectedWeekId && pendingSwap.day === d && pendingSwap.period === period && pendingSwap.room === selectedRoom) {
          td.classList.add("cell-selected");
        }
        td.onclick = () => handleCellClick(d, period, selectedRoom, entry);
      }

      tr.appendChild(td);
    });
    body.appendChild(tr);
  }
}

function renderAllTable(eff) {
  const headRow = document.getElementById("allHeadRow");
  headRow.innerHTML = '<th class="all-day-header all-day-cell">요일</th><th class="all-period-header all-period-cell">교시</th>';
  TEACHERS.forEach(name => {
    const th = document.createElement("th");
    th.className = "all-teacher-header";
    th.textContent = name;
    headRow.appendChild(th);
  });

  const body = document.getElementById("allBodyRows");
  body.innerHTML = "";

  DAYS.forEach((d, dayIdx) => {
    const totalPeriods = PERIODS_BY_DAY[d];
    for (let period = 1; period <= totalPeriods; period++) {
      const tr = document.createElement("tr");
      tr.className = "all-day-row" + (dayIdx % 2 === 1 ? " all-day-row-alt" : "") + (period === 1 && dayIdx > 0 ? " all-day-divider" : "");

      if (period === 1) {
        const dayTd = document.createElement("td");
        dayTd.className = "all-day-cell" + (d === today ? " today" : "");
        dayTd.textContent = DAY_FULL[d];
        dayTd.rowSpan = totalPeriods;
        tr.appendChild(dayTd);
      }

      const periodTd = document.createElement("td");
      periodTd.className = "all-period-cell";
      periodTd.textContent = period;
      tr.appendChild(periodTd);

      // 창의적 체험활동(금 5·6교시)은 학급 공용이라 교사별로 나눌 필요 없이 한 줄로 병합
      if (d === "금" && (period === 5 || period === 6)) {
        const mergedTd = document.createElement("td");
        mergedTd.colSpan = TEACHERS.length;
        mergedTd.className = "all-merged";
        mergedTd.textContent = "창의적 체험활동 (학급 공용)";
        tr.appendChild(mergedTd);
        body.appendChild(tr);
        continue;
      }

      TEACHERS.forEach((name, idx) => {
        const found = findTeacherEntry(eff.map, d, period, idx);
        const td = document.createElement("td");
        if (!found) {
          td.className = "empty-cell";
          td.textContent = "-";
        } else {
          td.className = "class-cell";
          const cat = categoryOf(found.entry.subject);
          const color = CATEGORY_COLOR[cat];
          td.innerHTML = `<div class="class-tag" style="background:${color}">${found.entry.subject}</div><div class="class-sub">${roomLabel(found.room)}</div>`;
          if (eff.subbed.has(found.key)) {
            const badge = document.createElement("div");
            badge.className = "badge-swap badge-sub";
            td.appendChild(badge);
            const orig = baseMap.get(found.key);
            td.title = `${name} — 결보강 · 원래 담당: ` + (orig ? TEACHERS[orig.teacherIdx] : "-");
          } else if (eff.changed.has(found.key)) {
            const badge = document.createElement("div");
            badge.className = "badge-swap";
            td.appendChild(badge);
            const orig = baseMap.get(found.key);
            const origLabel = orig ? (orig.subject === "창체" ? orig.subject : orig.subject + " · " + TEACHERS[orig.teacherIdx]) : "빈 시간";
            td.title = `${name} — 교환됨 · 원래: ` + origLabel;
          }
        }
        tr.appendChild(td);
      });

      body.appendChild(tr);
    }
  });
}


function renderLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  CATEGORY_ORDER.forEach(cat => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-dot" style="background:${CATEGORY_COLOR[cat]}"></span>${cat}`;
    legend.appendChild(item);
  });
  const swapItem = document.createElement("div");
  swapItem.className = "legend-item";
  swapItem.innerHTML = `<span class="legend-dot" style="background:var(--accent)"></span>교환됨`;
  legend.appendChild(swapItem);
  const subItem = document.createElement("div");
  subItem.className = "legend-item";
  subItem.innerHTML = `<span class="legend-dot" style="background:#2C5C8A"></span>결보강됨 (마우스를 올리면 원래 담당 표시)`;
  legend.appendChild(subItem);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderAll() {
  document.getElementById("adminToggle").textContent = adminMode ? "관리자 모드 ON" : "관리자 모드 켜기";
  document.getElementById("adminToggle").classList.toggle("on", adminMode);

  document.getElementById("btnTeacher").classList.toggle("active", mode === "teacher");
  document.getElementById("btnClass").classList.toggle("active", mode === "class");
  document.getElementById("btnAll").classList.toggle("active", mode === "all");
  document.getElementById("teacherSelector").style.display = mode === "teacher" ? "" : "none";
  document.getElementById("classSelector").style.display = mode === "class" ? "" : "none";
  document.querySelector(".table-wrap:not(.all-table-wrap)").style.display = mode === "all" ? "none" : "";
  document.getElementById("allTableWrap").style.display = mode === "all" ? "" : "none";

  renderWeekChips();
  renderSwapPanel();
  renderPendingBanner();

  const eff = buildEffective();

  const week = currentWeek();
  const relevantExchanges = week ? exchanges.filter(ex =>
    ex.type === "swap" ? (ex.a.weekId === week.id || ex.b.weekId === week.id) : ex.weekId === week.id
  ) : [];
  const hasSwapOrSub = relevantExchanges.length > 0;

  if (mode === "all") {
    document.getElementById("metaLabel").textContent = "전체 시간표";
    const swapCount = relevantExchanges.filter(ex => ex.type === "swap").length;
    const subCount = relevantExchanges.filter(ex => ex.type === "sub").length;
    document.getElementById("metaCount").textContent = week
      ? `교사 ${TEACHERS.length}명 · 학급 ${ROOMS.length}개 · 이번 주 교환 ${swapCount}건, 결보강 ${subCount}건`
      : `교사 ${TEACHERS.length}명 · 학급 ${ROOMS.length}개`;
    renderAllTable(eff);
  } else {
    let count = 0;
    if (mode === "class") {
      DAYS.forEach(d => { for (let p = 1; p <= PERIODS_BY_DAY[d]; p++) { if (eff.map.get(`${d}|${p}|${selectedRoom}`)) count++; } });
    } else {
      const idx = TEACHERS.indexOf(selectedTeacher);
      DAYS.forEach(d => { for (let p = 1; p <= PERIODS_BY_DAY[d]; p++) { if (findTeacherEntry(eff.map, d, p, idx)) count++; } });
    }
    document.getElementById("metaLabel").textContent = mode === "teacher" ? `${selectedTeacher} 선생님` : `${roomLabel(selectedRoom)}`;
    document.getElementById("metaCount").textContent = `주 ${count}시간`;
    if (mode === "teacher") renderTeacherChips(); else renderClassChips();
    renderTable(eff);
  }

  document.getElementById("metaSwapTag").style.display = hasSwapOrSub ? "" : "none";
}

// 이벤트 리스너 설정
document.getElementById("btnTeacher").onclick = () => { mode = "teacher"; pendingSwap = null; renderAll(); };
document.getElementById("btnClass").onclick = () => { mode = "class"; pendingSwap = null; renderAll(); };
document.getElementById("btnAll").onclick = () => { mode = "all"; pendingSwap = null; renderAll(); };
document.getElementById("teacherSearch").oninput = (e) => {
  query = e.target.value;
  document.getElementById("clearSearch").classList.toggle("show", query.length > 0);
  renderTeacherChips();
};
document.getElementById("clearSearch").onclick = () => {
  query = "";
  document.getElementById("teacherSearch").value = "";
  document.getElementById("clearSearch").classList.remove("show");
  renderTeacherChips();
};
document.getElementById("pendingCancelBtn").onclick = () => { pendingSwap = null; renderAll(); };
document.getElementById("adminToggle").onclick = () => {
  if (!adminMode) {
    askAdminPassword();
    return;
  }
  adminMode = false;
  pendingSwap = null;
  renderAll();
};

renderLegend();
initDataSync();
</script>
</body>
</html>
